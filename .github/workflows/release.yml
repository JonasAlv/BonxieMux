name: Release BonxieMux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v2.1.1). Leave blank to read Version from Directory.Build.props'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: 'skip'

jobs:
  build-and-release:
    name: Build & Release Linux AppImages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Lint UI tokens and conventions
        run: python3 ./scripts/lint-ui.py

      - name: Cache Rust toolchain build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Skua.WaylandHost

      - name: Test embedded Wayland host (Rust)
        run: cargo test --locked --manifest-path Skua.WaylandHost/Cargo.toml

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache appimagetool
        uses: actions/cache@v6
        with:
          path: ~/.cache/bonxiemux/tools
          key: ${{ runner.os }}-appimagetool-v1

      - name: Ensure Pillow for AppImage icons
        run: |
          if ! python3 -c "from PIL import Image" 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-pil
          fi

      - name: Determine Version Tag
        id: get_version
        run: |
          source ./build-config.sh
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v${APP_VERSION}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: $TAG (version: $VERSION)"

      - name: Package Linux AppImages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          Version: ${{ steps.get_version.outputs.version }}
        run: |
          chmod +x ./build-appimages.sh ./build-config.sh
          ./build-appimages.sh

      - name: Generate SHA256 Checksums
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          (
            cd Build
            sha256sum \
              "BonxieMux-${VERSION}-x86_64.AppImage" \
              "BonxieMux-Manager-${VERSION}-x86_64.AppImage" \
              "BonxieMux-${VERSION}-x86_64.tar.gz" \
              "BonxieMux-${VERSION}-x86_64.zip" \
              > SHA256SUMS.txt
          )
          cat Build/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          ASSETS=(
            "Build/BonxieMux-${VERSION}-x86_64.AppImage"
            "Build/BonxieMux-Manager-${VERSION}-x86_64.AppImage"
            "Build/BonxieMux-${VERSION}-x86_64.tar.gz"
            "Build/BonxieMux-${VERSION}-x86_64.zip"
            "Build/SHA256SUMS.txt"
          )
          for asset in "${ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Error: Release asset $asset not found!" >&2
              exit 1
            fi
          done

          echo "Publishing release $TAG with assets: ${ASSETS[*]}..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "BonxieMux $TAG" --generate-notes
          fi
          echo "Release $TAG published successfully!"
