name: Build BonxieMux

on:
  push:
    branches:
      - main
      - linux
  pull_request:
    branches:
      - main
      - linux
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: 'skip'

jobs:
  build:
    name: Build solution (.NET 10 / Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint UI tokens and conventions
        run: python3 ./scripts/lint-ui.py

      - name: Cache Rust toolchain build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Skua.WaylandHost

      - name: Test embedded Wayland host (Rust)
        run: cargo test --locked --manifest-path Skua.WaylandHost/Cargo.toml

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache skua-mugetsu player
        uses: actions/cache@v4
        with:
          path: player
          key: ${{ runner.os }}-mugetsu-${{ hashFiles('Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-mugetsu-

      - name: Build portable Linux binaries
        id: build_bin
        run: |
          chmod +x ./build-binaries.sh ./build-config.sh
          source ./build-config.sh
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          ./build-binaries.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BonxieMux-${{ steps.build_bin.outputs.version }}-x86_64
          retention-days: 14
          path: |
            Build/BonxieMux-${{ steps.build_bin.outputs.version }}-x86_64.tar.gz
            Build/BonxieMux-${{ steps.build_bin.outputs.version }}-x86_64.zip
